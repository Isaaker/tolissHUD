name: Build release and publish SkunkCrafts depot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, e.g. v2.2.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: xphud-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets and SkunkCrafts depot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag, got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install Lua parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4

      - name: Validate release source
        run: |
          luac5.4 -p xphud_toliss_a32x.lua
          python3 -m unittest discover -s tests -v

      - name: Build manual installer, SkunkCrafts depot and release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          XPHUD_PAGES_BASE_URL: ${{ vars.XPHUD_PAGES_BASE_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/build_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --output-dir dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="dist/XPHUD_ToLiss_A32X_v${RELEASE_VERSION}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
            gh release edit "$RELEASE_TAG" --title "XPHUD ToLiss A32X $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --verify-tag \
              --title "XPHUD ToLiss A32X $RELEASE_TAG" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Upload static SkunkCrafts depot for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Publish SkunkCrafts production depot
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy depot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
